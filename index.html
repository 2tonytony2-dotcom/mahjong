<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀計數器 (離線版)</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #f5f5f5;
            --accent-color: #d32f2f;
            --text-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 12px;
            background-color: #e8f5e9;
            color: var(--text-color);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1, h2, h3, h4 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:active {
            opacity: 0.8;
        }

        button.danger {
            background-color: var(--accent-color);
        }

        button.secondary {
            background-color: #757575;
        }

        button.action {
            background-color: #1976d2;
        }

        button.warning {
            background-color: #f57c00;
        }

        button.success {
            background-color: #388e3c;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .grid-seats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .seat-card {
            border: 2px solid #a5d6a7;
            border-radius: 8px;
            padding: 10px;
            background-color: #f1f8e9;
            text-align: center;
            position: relative;
        }

        .seat-card.selected {
            border-color: #e91e63;
            background-color: #fce4ec;
        }

        .seat-wind {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 14px;
        }

        .seat-name {
            font-size: 18px;
            font-weight: bold;
            margin: 5px 0;
        }

        .seat-score {
            font-size: 16px;
            color: #d32f2f;
            font-weight: bold;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .log-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 8px;
            border-radius: 6px;
            background: #fafafa;
            font-size: 13px;
        }

        .settlement-card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .settlement-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #ccc;
            font-size: 15px;
        }
        .settlement-item:last-child {
            border-bottom: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 440px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .cost-deduction-banner {
            background-color: #fff3e0;
            border: 1px solid #ffe0b2;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #e65100;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 步驟 1: 基本設定 -->
    <div id="step-setup" class="section active">
        <h1>麻雀計數器</h1>
        
        <div class="form-group">
            <label>選擇玩家人數：</label>
            <select id="player-count" onchange="generatePlayerInputs()">
                <option value="4">4 人</option>
                <option value="3">3 人</option>
                <option value="2">2 人</option>
            </select>
        </div>

        <div id="player-inputs"></div>

        <div class="form-group">
            <label>選擇玩法：</label>
            <select id="game-type" onchange="toggleGameTypeOptions()">
                <option value="pmj">跑馬仔</option>
                <option value="gd">廣東牌</option>
            </select>
        </div>

        <!-- 跑馬仔設定 -->
        <div id="pmj-options">
            <div class="form-group">
                <label>大細設定 (X/Y，例：10/20)：</label>
                <div style="display:flex; gap:10px;">
                    <input type="number" id="pmj-x" placeholder="X (明槓/補槓底/打出)" value="10">
                    <input type="number" id="pmj-y" placeholder="Y (暗槓/自摸底)" value="20">
                </div>
            </div>
            <div class="form-group">
                <label>打幾多隻馬：</label>
                <input type="number" id="pmj-horse-count" value="2" min="0">
            </div>
        </div>

        <!-- 抽水與成本設定 -->
        <div class="form-group">
            <label>扣費模式：</label>
            <select id="rake-type" onchange="toggleRakeOptions()">
                <option value="none">不抽水 / 不扣費</option>
                <option value="percent">每局按比例抽水 (%)</option>
                <option value="cost">結算時扣除固定總成本 (例：場租/飯錢/水費)</option>
            </select>
        </div>

        <div id="rake-percent-group" class="form-group" style="display:none;">
            <label>抽水比例 (%)：</label>
            <input type="number" id="rake-percent" value="5" min="0" max="100">
        </div>

        <div id="rake-cost-group" class="form-group" style="display:none;">
            <label>待扣除總成本金頭 ($)：</label>
            <input type="number" id="total-cost" value="100" min="0">
            <small style="color:#666;">（遊戲期間如常計分，最後結算時會從贏家/所有玩家數額中扣除）</small>
        </div>

        <button onclick="goToSeating()">下一步：安排座位</button>
    </div>

    <!-- 步驟 2: 選位 -->
    <div id="step-seating" class="section">
        <h2>選擇座位</h2>
        <p style="text-align:center; color:#666; font-size:14px;">請分別為「東、南、西、北」選擇對應玩家</p>
        
        <div class="form-group"><label>東位：</label><select id="seat-east" class="seat-select"></select></div>
        <div class="form-group"><label>南位：</label><select id="seat-south" class="seat-select"></select></div>
        <div class="form-group" id="seat-west-group"><label>西位：</label><select id="seat-west" class="seat-select"></select></div>
        <div class="form-group" id="seat-north-group"><label>北位：</label><select id="seat-north" class="seat-select"></select></div>

        <div class="btn-group">
            <button class="secondary" onclick="showStep('step-setup')">返回</button>
            <button onclick="startGame()">開始遊戲</button>
        </div>
    </div>

    <!-- 步驟 3: 遊戲主畫面 -->
    <div id="step-game" class="section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>戰局進行中</h3>
            <span id="pool-info" style="font-size: 12px; color: #555;"></span>
        </div>

        <div class="grid-seats" id="game-seats"></div>

        <div class="action-grid">
            <button class="action" onclick="openKongModal()">開槓</button>
            <button class="action" onclick="openWinModal()">食糊 / 自摸</button>
        </div>

        <div class="btn-group" style="margin-bottom: 10px;">
            <button class="secondary" onclick="openSwapModal()">座位對調</button>
            <button class="secondary" onclick="openReplaceModal()">換人 / 替換</button>
        </div>

        <div class="btn-group" style="margin-bottom: 15px;">
            <button id="btn-undo" class="warning" onclick="undo()" disabled>↺ 還原上一步</button>
            <button class="success" onclick="openSettlementModal()">💰 遊戲結算</button>
        </div>

        <h4>對局紀錄</h4>
        <div class="log-list" id="game-log"></div>
    </div>
</div>

<!-- 通用 Modal -->
<div id="action-modal" class="modal">
    <div class="modal-content" id="modal-body"></div>
</div>

<script>
    let state = {
        players: [], // { id, name, score }
        seats: { East: null, South: null, West: null, North: null },
        gameType: 'pmj',
        pmj: { x: 10, y: 20, maxHorses: 2 },
        rake: { type: 'none', percent: 0, targetCost: 0, totalRakeCollected: 0 },
        logs: []
    };

    let historyStack = [];
    let swapTempSeat = null;

    window.onload = function() {
        generatePlayerInputs();
    };

    function showStep(stepId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    function generatePlayerInputs() {
        const count = parseInt(document.getElementById('player-count').value);
        const container = document.getElementById('player-inputs');
        container.innerHTML = '';
        for (let i = 1; i <= count; i++) {
            container.innerHTML += `
                <div class="form-group">
                    <label>玩家 ${i} 名稱：</label>
                    <input type="text" class="player-name-input" value="玩家 ${i}">
                </div>
            `;
        }
    }

    function toggleGameTypeOptions() {
        const type = document.getElementById('game-type').value;
        document.getElementById('pmj-options').style.display = (type === 'pmj') ? 'block' : 'none';
    }

    function toggleRakeOptions() {
        const type = document.getElementById('rake-type').value;
        document.getElementById('rake-percent-group').style.display = (type === 'percent') ? 'block' : 'none';
        document.getElementById('rake-cost-group').style.display = (type === 'cost') ? 'block' : 'none';
    }

    function goToSeating() {
        const nameInputs = document.querySelectorAll('.player-name-input');
        state.players = [];
        nameInputs.forEach((input, index) => {
            state.players.push({
                id: 'p_' + Date.now() + '_' + index,
                name: input.value.trim() || `玩家 ${index + 1}`,
                score: 0
            });
        });

        const seatSelects = document.querySelectorAll('.seat-select');
        seatSelects.forEach(select => {
            select.innerHTML = '<option value="">-- 請選擇 --</option>';
            state.players.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            });
        });

        const count = state.players.length;
        document.getElementById('seat-west-group').style.display = count >= 3 ? 'block' : 'none';
        document.getElementById('seat-north-group').style.display = count >= 4 ? 'block' : 'none';

        if(count >= 1) document.getElementById('seat-east').value = state.players[0].id;
        if(count >= 2) document.getElementById('seat-south').value = state.players[1].id;
        if(count >= 3) document.getElementById('seat-west').value = state.players[2].id;
        if(count >= 4) document.getElementById('seat-north').value = state.players[3].id;

        showStep('step-seating');
    }

    function startGame() {
        state.seats.East = document.getElementById('seat-east').value;
        state.seats.South = document.getElementById('seat-south').value;
        state.seats.West = state.players.length >= 3 ? document.getElementById('seat-west').value : null;
        state.seats.North = state.players.length >= 4 ? document.getElementById('seat-north').value : null;

        const selected = Object.values(state.seats).filter(v => v !== null);
        if (new Set(selected).size !== selected.length || selected.includes("")) {
            alert('請確保每名玩家佔據獨立的座位！');
            return;
        }

        state.gameType = document.getElementById('game-type').value;
        state.pmj.x = parseFloat(document.getElementById('pmj-x').value) || 0;
        state.pmj.y = parseFloat(document.getElementById('pmj-y').value) || 0;
        state.pmj.maxHorses = parseInt(document.getElementById('pmj-horse-count').value) || 0;

        state.rake.type = document.getElementById('rake-type').value;
        state.rake.percent = parseFloat(document.getElementById('rake-percent').value) || 0;
        state.rake.targetCost = parseFloat(document.getElementById('total-cost').value) || 0;

        historyStack = [];
        renderGameBoard();
        showStep('step-game');
    }

    function saveSnapshot() {
        historyStack.push(JSON.parse(JSON.stringify(state)));
        updateUndoButtonState();
    }

    function undo() {
        if (historyStack.length === 0) return;
        state = historyStack.pop();
        updateUndoButtonState();
        renderGameBoard();
        
        const logContainer = document.getElementById('game-log');
        logContainer.innerHTML = state.logs.map(l => `<div>• ${l}</div>`).join('');
    }

    function updateUndoButtonState() {
        const undoBtn = document.getElementById('btn-undo');
        if (undoBtn) {
            undoBtn.disabled = historyStack.length === 0;
        }
    }

    function renderGameBoard() {
        const container = document.getElementById('game-seats');
        container.innerHTML = '';

        const winds = { East: '東', South: '南', West: '西', North: '北' };

        for (let [wind, playerId] of Object.entries(state.seats)) {
            if (!playerId && state.players.length < 4 && (wind === 'West' || wind === 'North')) continue;
            
            const player = state.players.find(p => p.id === playerId);
            const isSelected = swapTempSeat === wind ? 'selected' : '';

            container.innerHTML += `
                <div class="seat-card ${isSelected}" onclick="handleSeatClick('${wind}')">
                    <div class="seat-wind">${winds[wind]}位</div>
                    <div class="seat-name">${player ? player.name : '空置'}</div>
                    <div class="seat-score">$ ${player ? player.score.toFixed(1) : 0}</div>
                </div>
            `;
        }

        let poolText = '';
        if (state.rake.type === 'percent') {
            poolText = `已抽水: $${state.rake.totalRakeCollected.toFixed(1)}`;
        } else if (state.rake.type === 'cost') {
            poolText = `待結算扣除成本: $${state.rake.targetCost}`;
        }
        document.getElementById('pool-info').innerText = poolText;
        updateUndoButtonState();
    }

    function getActivePlayers() {
        return Object.values(state.seats).map(id => state.players.find(p => p.id === id)).filter(Boolean);
    }

    // 遊戲進行期間的派彩處理 (若選擇成本模式，平時不扣除，留待結算時一次過扣)
    function processWinnings(winnerId, grossAmount) {
        let actualGain = grossAmount;
        let deducted = 0;

        if (state.rake.type === 'percent' && state.rake.percent > 0) {
            deducted = grossAmount * (state.rake.percent / 100);
            actualGain = grossAmount - deducted;
            state.rake.totalRakeCollected += deducted;
        }

        const winner = state.players.find(p => p.id === winnerId);
        winner.score += actualGain;

        return { actualGain, deducted };
    }

    function addLog(text) {
        state.logs.unshift(text);
        const logContainer = document.getElementById('game-log');
        logContainer.innerHTML = state.logs.map(l => `<div>• ${l}</div>`).join('');
    }

    function closeModal() {
        document.getElementById('action-modal').style.display = 'none';
    }

    function openModal(html) {
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('action-modal').style.display = 'flex';
    }

    function openKongModal() {
        const activePlayers = getActivePlayers();
        let optionsHtml = activePlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

        const html = `
            <h3>開槓結算</h3>
            <div class="form-group">
                <label>開槓玩家：</label>
                <select id="kong-player">${optionsHtml}</select>
            </div>
            <div class="form-group">
                <label>槓牌類型：</label>
                <select id="kong-type" onchange="toggleKongTarget(this.value)">
                    <option value="dark">暗槓 (每人付 $${state.pmj.y})</option>
                    <option value="light">明槓 (打出者付 $${3 * state.pmj.x})</option>
                    <option value="patch">補槓 (每人付 $${state.pmj.x})</option>
                </select>
            </div>
            <div class="form-group" id="kong-target-group" style="display:none;">
                <label>打出玩家：</label>
                <select id="kong-target">${optionsHtml}</select>
            </div>
            <div class="btn-group">
                <button class="secondary" onclick="closeModal()">取消</button>
                <button onclick="submitKong()">確定</button>
            </div>
        `;
        openModal(html);
    }

    function toggleKongTarget(type) {
        document.getElementById('kong-target-group').style.display = (type === 'light') ? 'block' : 'none';
    }

    function submitKong() {
        const winnerId = document.getElementById('kong-player').value;
        const type = document.getElementById('kong-type').value;
        const winner = state.players.find(p => p.id === winnerId);
        const activePlayers = getActivePlayers();

        if (type === 'light') {
            const targetId = document.getElementById('kong-target').value;
            if (targetId === winnerId) { alert('開槓者與打出者不能相同'); return; }
        }

        saveSnapshot();

        let grossAmount = 0;
        let logDetail = '';

        if (type === 'dark') {
            const payAmount = state.pmj.y;
            activePlayers.forEach(p => {
                if (p.id !== winnerId) {
                    p.score -= payAmount;
                    grossAmount += payAmount;
                }
            });
            logDetail = `${winner.name} 暗槓 (+各玩家 $${payAmount})`;
        } else if (type === 'light') {
            const targetId = document.getElementById('kong-target').value;
            const target = state.players.find(p => p.id === targetId);
            const payAmount = 3 * state.pmj.x;
            target.score -= payAmount;
            grossAmount = payAmount;
            logDetail = `${winner.name} 明槓 (${target.name} 打出付 $${payAmount})`;
        } else if (type === 'patch') {
            const payAmount = state.pmj.x;
            activePlayers.forEach(p => {
                if (p.id !== winnerId) {
                    p.score -= payAmount;
                    grossAmount += payAmount;
                }
            });
            logDetail = `${winner.name} 補槓 (+各玩家 $${payAmount})`;
        }

        const { actualGain, deducted } = processWinnings(winnerId, grossAmount);
        let rakeText = deducted > 0 ? ` (抽水: $${deducted.toFixed(1)})` : '';
        addLog(`${logDetail}，實收 $${actualGain.toFixed(1)}${rakeText}`);

        closeModal();
        renderGameBoard();
    }

    function openWinModal() {
        const activePlayers = getActivePlayers();
        let optionsHtml = activePlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        
        let horseOptions = '';
        for(let i=0; i <= state.pmj.maxHorses; i++) {
            horseOptions += `<option value="${i}">${i} 隻</option>`;
        }

        const html = `
            <h3>食糊 / 自摸結算</h3>
            <div class="form-group">
                <label>食糊玩家：</label>
                <select id="win-player">${optionsHtml}</select>
            </div>
            <div class="form-group">
                <label>贏牌方式：</label>
                <select id="win-type" onchange="toggleWinOptions(this.value)">
                    <option value="discard">出衝/食糊 (打出者付 $${state.pmj.x})</option>
                    <option value="self">自摸 (每人付 $(1+中馬)*${state.pmj.y})</option>
                    <option value="rob">搶槓 (被搶者付 3*(1+中馬)*${state.pmj.y})</option>
                </select>
            </div>
            <div class="form-group" id="win-target-group">
                <label>打出/被搶槓玩家：</label>
                <select id="win-target">${optionsHtml}</select>
            </div>
            <div class="form-group" id="win-horse-group" style="display:none;">
                <label>中馬數量：</label>
                <select id="win-horses">${horseOptions}</select>
            </div>
            <div class="btn-group">
                <button class="secondary" onclick="closeModal()">取消</button>
                <button onclick="submitWin()">確定</button>
            </div>
        `;
        openModal(html);
    }

    function toggleWinOptions(type) {
        document.getElementById('win-target-group').style.display = (type === 'self') ? 'none' : 'block';
        document.getElementById('win-horse-group').style.display = (type === 'discard') ? 'none' : 'block';
    }

    function submitWin() {
        const winnerId = document.getElementById('win-player').value;
        const type = document.getElementById('win-type').value;
        const winner = state.players.find(p => p.id === winnerId);
        const activePlayers = getActivePlayers();
        const horses = parseInt(document.getElementById('win-horses')?.value || 0);

        if (type === 'discard' || type === 'rob') {
            const targetId = document.getElementById('win-target').value;
            if (targetId === winnerId) { alert('食糊者與打出/被搶槓者不能相同'); return; }
        }

        saveSnapshot();

        let grossAmount = 0;
        let logDetail = '';

        if (type === 'discard') {
            const targetId = document.getElementById('win-target').value;
            const target = state.players.find(p => p.id === targetId);
            const payAmount = state.pmj.x;
            
            target.score -= payAmount;
            grossAmount = payAmount;
            logDetail = `${winner.name} 食糊 (${target.name} 打出付 $${payAmount})`;
        } else if (type === 'self') {
            const payAmountPerPerson = (1 + horses) * state.pmj.y;
            activePlayers.forEach(p => {
                if (p.id !== winnerId) {
                    p.score -= payAmountPerPerson;
                    grossAmount += payAmountPerPerson;
                }
            });
            logDetail = `${winner.name} 自摸 (中 ${horses} 隻馬，每人付 $${payAmountPerPerson})`;
        } else if (type === 'rob') {
            const targetId = document.getElementById('win-target').value;
            const target = state.players.find(p => p.id === targetId);
            const payAmount = 3 * (1 + horses) * state.pmj.y;

            target.score -= payAmount;
            grossAmount = payAmount;
            logDetail = `${winner.name} 搶槓 ${target.name} (中 ${horses} 隻馬，包付 $${payAmount})`;
        }

        const { actualGain, deducted } = processWinnings(winnerId, grossAmount);
        let rakeText = deducted > 0 ? ` (抽水: $${deducted.toFixed(1)})` : '';
        addLog(`${logDetail}，實收 $${actualGain.toFixed(1)}${rakeText}`);

        closeModal();
        renderGameBoard();
    }

    function openSwapModal() {
        alert("換位模式：請在畫面上先點擊第一個座位，再點擊第二個座位即可交換。");
        swapTempSeat = null;
    }

    function handleSeatClick(wind) {
        if (swapTempSeat === null) {
            swapTempSeat = wind;
            renderGameBoard();
        } else if (swapTempSeat === wind) {
            swapTempSeat = null;
            renderGameBoard();
        } else {
            saveSnapshot();

            const tempPlayer = state.seats[swapTempSeat];
            state.seats[swapTempSeat] = state.seats[wind];
            state.seats[wind] = tempPlayer;

            const winds = { East: '東', South: '南', West: '西', North: '北' };
            addLog(`座位對調：${winds[swapTempSeat]}位 與 ${winds[wind]}位 對調`);

            swapTempSeat = null;
            renderGameBoard();
        }
    }

    function openReplaceModal() {
        const winds = { East: '東', South: '南', West: '西', North: '北' };
        
        let activeSeatOptions = Object.keys(state.seats)
            .filter(w => state.seats[w] !== null)
            .map(w => {
                const p = state.players.find(player => player.id === state.seats[w]);
                return `<option value="${w}">${winds[w]}位 (${p ? p.name : '空位'})</option>`;
            }).join('');

        const activeIds = Object.values(state.seats).filter(Boolean);
        const inactivePlayers = state.players.filter(p => !activeIds.includes(p.id));

        let inactiveOptions = '<option value="__NEW__">+ 新增新玩家</option>';
        inactivePlayers.forEach(p => {
            inactiveOptions += `<option value="${p.id}">換回過往玩家: ${p.name} (累積分數: $${p.score.toFixed(1)})</option>`;
        });

        const html = `
            <h3>玩家換人 / 替代</h3>
            <div class="form-group">
                <label>被替換的座位：</label>
                <select id="replace-seat">${activeSeatOptions}</select>
            </div>
            <div class="form-group">
                <label>選擇入場玩家：</label>
                <select id="select-incoming-player" onchange="toggleNewPlayerInput(this.value)">
                    ${inactiveOptions}
                </select>
            </div>
            <div class="form-group" id="new-player-input-group">
                <label>新玩家姓名：</label>
                <input type="text" id="new-player-name" placeholder="輸入新玩家名字">
            </div>
            <div class="btn-group">
                <button class="secondary" onclick="closeModal()">取消</button>
                <button onclick="submitReplace()">確定換人</button>
            </div>
        `;
        openModal(html);
    }

    function toggleNewPlayerInput(val) {
        document.getElementById('new-player-input-group').style.display = (val === '__NEW__') ? 'block' : 'none';
    }

    function submitReplace() {
        const seat = document.getElementById('replace-seat').value;
        const incomingVal = document.getElementById('select-incoming-player').value;
        const winds = { East: '東', South: '南', West: '西', North: '北' };

        saveSnapshot();

        let incomingPlayer = null;

        if (incomingVal === '__NEW__') {
            const name = document.getElementById('new-player-name').value.trim();
            if (!name) { alert('請輸入新玩家名字'); return; }
            incomingPlayer = {
                id: 'p_' + Date.now(),
                name: name,
                score: 0
            };
            state.players.push(incomingPlayer);
        } else {
            incomingPlayer = state.players.find(p => p.id === incomingVal);
        }

        const oldPlayerId = state.seats[seat];
        const oldPlayer = state.players.find(p => p.id === oldPlayerId);

        state.seats[seat] = incomingPlayer.id;
        addLog(`玩家替換：${incomingPlayer.name} 入替 ${winds[seat]}位 (${oldPlayer ? oldPlayer.name : ''})`);

        closeModal();
        renderGameBoard();
    }

    // ---------------- 遊戲結算 (最終扣除成本與轉帳計算) ----------------
    function openSettlementModal() {
        let html = `<h3>💰 遊戲總結算</h3>`;

        // 深拷貝玩家數據以計算結算扣除成本後的金額
        let settlementPlayers = JSON.parse(JSON.stringify(state.players));
        let totalCostDeducted = 0;

        if (state.rake.type === 'cost' && state.rake.targetCost > 0) {
            totalCostDeducted = state.rake.targetCost;
            
            // 找出所有正數贏家
            let winners = settlementPlayers.filter(p => p.score > 0);
            let totalProfit = winners.reduce((sum, p) => sum + p.score, 0);

            if (totalProfit > 0) {
                // 按贏錢比例扣除成本
                winners.forEach(p => {
                    let costShare = (p.score / totalProfit) * totalCostDeducted;
                    p.score -= costShare;
                });
            } else {
                // 若全場無贏家（或平手），則平分成本
                let sharePerPerson = totalCostDeducted / settlementPlayers.length;
                settlementPlayers.forEach(p => p.score -= sharePerPerson);
            }

            html += `
                <div class="cost-deduction-banner">
                    💡 已於結算時統一扣除總成本 <strong>$${totalCostDeducted}</strong> (按贏家獲利比例扣減)。
                </div>
            `;
        }

        // 1. 各玩家總盈虧列表
        html += `<div class="settlement-card"><h4>玩家最終盈虧 (已含結算扣費)</h4>`;
        settlementPlayers.forEach(p => {
            const color = p.score >= 0 ? '#2e7d32' : '#d32f2f';
            const sign = p.score > 0 ? '+' : '';
            html += `
                <div class="settlement-item">
                    <span><strong>${p.name}</strong></span>
                    <span style="color: ${color}; font-weight: bold;">${sign}$${p.score.toFixed(1)}</span>
                </div>
            `;
        });
        html += `</div>`;

        if (state.rake.type === 'percent') {
            html += `
                <div class="settlement-card">
                    <div class="settlement-item">
                        <span><strong>總抽水累積:</strong></span>
                        <span style="color:#d32f2f; font-weight:bold;">$${state.rake.totalRakeCollected.toFixed(1)}</span>
                    </div>
                </div>
            `;
        }

        // 2. 最簡轉帳指南
        const transactions = calculateTransfers(settlementPlayers);

        html += `<div class="settlement-card"><h4>建議付款指南 (最簡化轉帳)</h4>`;
        if (transactions.length === 0) {
            html += `<p style="text-align:center; color:#666;">無須轉帳，收支打平。</p>`;
        } else {
            transactions.forEach(t => {
                html += `
                    <div class="settlement-item">
                        <span><strong>${t.from}</strong> 需支付 <strong>${t.to}</strong></span>
                        <span style="color:#1976d2; font-weight:bold;">$${t.amount.toFixed(1)}</span>
                    </div>
                `;
            });
        }
        html += `</div>`;

        html += `
            <div class="btn-group">
                <button class="secondary" onclick="closeModal()">關閉</button>
            </div>
        `;

        openModal(html);
    }

    function calculateTransfers(players) {
        let debtors = [];   // 負數 (需給錢)
        let creditors = []; // 正數 (需收錢)

        players.forEach(p => {
            const amount = Math.round(p.score * 10) / 10;
            if (amount < -0.01) {
                debtors.push({ name: p.name, amount: -amount });
            } else if (amount > 0.01) {
                creditors.push({ name: p.name, amount: amount });
            }
        });

        let transactions = [];
        let i = 0, j = 0;

        while (i < debtors.length && j < creditors.length) {
            let debtor = debtors[i];
            let creditor = creditors[j];

            let payment = Math.min(debtor.amount, creditor.amount);
            transactions.push({
                from: debtor.name,
                to: creditor.name,
                amount: payment
            });

            debtor.amount -= payment;
            creditor.amount -= payment;

            if (debtor.amount < 0.01) i++;
            if (creditor.amount < 0.01) j++;
        }

        return transactions;
    }
</script>
